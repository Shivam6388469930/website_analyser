version: "3.8"

services:
  backend:
    build: .              # Root folder containing server.js
    container_name: backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - app-network

  frontend:
    build: ./client       # React app is inside /client
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
